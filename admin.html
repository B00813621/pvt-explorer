<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — PVT Explorer</title><style>body{font-family:system-ui,sans-serif;background:#f5f7f4;color:#17343b;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.panel{background:white;border:1px solid #dfe8e2;border-radius:16px;padding:20px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input{padding:12px;border:1px solid #ccd8d1;border-radius:9px;min-width:0;flex:1}button{border:0;border-radius:9px;padding:11px 15px;background:#087e79;color:white;font-weight:700;cursor:pointer}.reject{background:#8c3f38}.item{border-top:1px solid #e5ece7;padding:16px 0}.muted{color:#60737a;font-size:13px}.error{color:#9d332b}</style></head><body><main class="wrap"><h1>Administration PVT Explorer</h1><p class="muted">Modération des questions et réponses publiées sur le forum. Le token reste dans cette session de navigateur.</p><section class="panel"><h2>Connexion administrateur</h2><div class="row"><input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password"><button id="save">Se connecter</button></div><p id="status" class="muted"></p></section><section class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>Contenus à modérer</h2><button id="refresh">Actualiser</button></div><div id="items" class="muted">Connecte-toi pour charger la file de modération.</div></section><section class="panel"><h2>Statistiques simples</h2><div id="stats" class="muted">Disponibles après connexion.</div></section></main><script>
let token=sessionStorage.getItem('pvtAdminToken')||'';const $=id=>document.getElementById(id);$('token').value=token;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur serveur');return d;}
async function load(){if(!token){$('status').textContent='Saisis ton token administrateur.';return;}try{const d=await api('/api/admin/pending');$('status').textContent='Connecté.';$('items').innerHTML=d.items.length?d.items.map(x=>`<article class="item"><b>${x.type==='question'?'Question':'Réponse'} — ${esc(x.title||'')}</b><p>${esc(x.body||'')}</p><p class="muted">${esc(x.author||'')} · ${esc(x.country||'')} · ${new Date(x.createdAt).toLocaleString('fr-FR')}</p><div class="row"><button onclick="moderate('${x.type}','${x.questionId}','${x.id}','approve')">Publier</button><button class="reject" onclick="moderate('${x.type}','${x.questionId}','${x.id}','reject')">Refuser</button></div></article>`).join(''):'Aucun contenu en attente.';const st=await api('/api/admin/stats');$('stats').textContent=`Questions : ${st.questions} · Publiées : ${st.approved} · En attente : ${st.pending} · Clics sortants : `+Object.entries(st.clicks||{}).map(([k,v])=>k+' '+v).join(' · ');}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';}}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.moderate=async(type,questionId,id,action)=>{try{await api('/api/admin/moderate',{type,questionId,id,action});await load();}catch(e){alert(e.message)}};
$('save').onclick=()=>{token=$('token').value.trim();sessionStorage.setItem('pvtAdminToken',token);load()};$('refresh').onclick=load;if(token)load();
</script></body></html>
